# /etc/nginx/sites-available/teknulugycard.conf
# Needs a wildcard certificate for teknulugycard.com + *.teknulugycard.com (see README).

# HTTP -> HTTPS
server {
    listen 80;
    server_name teknulugycard.com *.teknulugycard.com;
    return 301 https://$host$request_uri;
}

# Admin dashboard (React build)
server {
    listen 443 ssl http2;
    server_name admin.teknulugycard.com;

    ssl_certificate     /etc/letsencrypt/live/teknulugycard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teknulugycard.com/privkey.pem;

    root /var/www/tekcard-admin/dist;
    index index.html;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}

# API (back.) + root domain + every card subdomain (eslam.teknulugycard.com ...)
server {
    listen 443 ssl http2;
    server_name back.teknulugycard.com teknulugycard.com *.teknulugycard.com;

    ssl_certificate     /etc/letsencrypt/live/teknulugycard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teknulugycard.com/privkey.pem;

    client_max_body_size 10m;

    location /uploads/ {
        alias /var/www/tekcard-api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
