# /etc/nginx/sites-available/teknulugycard.conf
# Certificates:
#   /etc/letsencrypt/live/teknulugycard.com/   root, www, admin, back   (certbot --webroot, auto-renew)
#   /etc/lego/certificates/                    *.teknulugycard.com      (lego + Hostinger DNS API, weekly cron)

server {
    listen 80;
    server_name teknulugycard.com www.teknulugycard.com admin.teknulugycard.com back.teknulugycard.com *.teknulugycard.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# Admin dashboard (React build)
server {
    listen 443 ssl;
    server_name admin.teknulugycard.com;
    ssl_certificate     /etc/letsencrypt/live/teknulugycard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teknulugycard.com/privkey.pem;
    root /var/www/tekcard-admin/dist;
    index index.html;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html =404; }
}

# API + main domain
server {
    listen 443 ssl;
    server_name back.teknulugycard.com teknulugycard.com www.teknulugycard.com;
    ssl_certificate     /etc/letsencrypt/live/teknulugycard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teknulugycard.com/privkey.pem;
    client_max_body_size 10m;
    location /uploads/ {
        alias /var/www/tekcard-api/uploads/;
        expires 30d;
        add_header Access-Control-Allow-Origin "*";
    }
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

